<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Vice City Sunset Gradient for VI -->
    <linearGradient id="gtaSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="35%" stop-color="#ff3366" />
      <stop offset="70%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <!-- Chrome / Gold Specular Gradient -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="40%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <!-- Deep Vice City Midnight Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007f" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.9" />
    </filter>
    
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd700" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Dark Shield/Tile Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#darkBg)" stroke="#ff007f" stroke-width="4" stroke-opacity="0.9" />
  
  <!-- Inner Subtle Neon Cyan Inset Border -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Background Watermark: Police Star Outline -->
  <polygon points="64,16 75,44 105,44 80,62 90,92 64,74 38,92 48,62 23,44 53,44" fill="none" stroke="#ffd700" stroke-width="2" stroke-opacity="0.2" />

  <!-- Iconic GTA VI Roman Numerals: "VI" -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'V' -->
    <polygon points="20,32 38,32 54,84 64,84 80,32 98,32 74,96 44,96" fill="url(#gtaSunset)" />
    
    <!-- Letter 'I' -->
    <polygon points="86,32 104,32 104,96 86,96" fill="url(#gtaSunset)" />
  </g>

  <!-- Glowing Wanted Star in Top Right -->
  <polygon points="102,12 105,20 114,20 107,25 110,33 102,28 94,33 97,25 90,20 99,20" fill="url(#goldStar)" filter="url(#starGlow)" />

  <!-- Subtle VCPD Micro Stamp at Bottom -->
  <text x="64" y="114" fill="#00f3ff" font-family="'Chakra Petch', sans-serif, -apple-system" font-weight="700" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.9">VCPD LAB</text>
</svg>